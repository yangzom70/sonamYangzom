    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"
    ></script>

    <script>
      emailjs.init("BDkhGjmmy3uvQ2-JY");

      function sendEmail(event) {
        event.preventDefault(); // prevent default form submission

        // Correct IDs
        const name = document.getElementById("name-field").value.trim();
        const email = document.getElementById("email-field").value.trim();
        const subject = document.getElementById("subject-field").value.trim();
        const message = document.getElementById("message-field").value.trim();

        if (!name || !email || !message) {
          alert("Please fill in name, email and message.");
          return;
        }

        const templateParams = {
          name: name,
          email: email,
          subject: subject,
          message: message,
        };

        emailjs
          .send("service_9d5vgvi", "template_9zlholp", templateParams)
          .then(function (response) {
            console.log("SUCCESS!", response.status, response.text);
            document.getElementById("contact-form").reset();
            alert("Email sent successfully!");
          })
          .catch(function (error) {
            console.error("EmailJS error:", error);
            alert("Failed to send email. See console for details.");
          });
      }
    </script>
